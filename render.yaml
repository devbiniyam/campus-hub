databases:
  - name: campus-hub-db
    databaseName: campus_hub
    user: campus_hub_user
    plan: free

services:
  - type: web
    name: campus-hub-backend
    runtime: python
    buildCommand: "bash ./build.sh"
    startCommand: "gunicorn backend.wsgi:application --bind 0.0.0.0:$PORT"
    rootDir: Backend/backend
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: campus-hub-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "false"
      - key: ALLOWED_HOSTS
        value: ".onrender.com,localhost,127.0.0.1,.vercel.app"
      - key: CORS_ALLOW_ALL_ORIGINS
        value: "true"

  - type: static
    name: campus-hub-frontend
    rootDir: Frontend
    buildCommand: "npm install && npm run build"
    staticPublishPath: "./build"
    plan: free
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

